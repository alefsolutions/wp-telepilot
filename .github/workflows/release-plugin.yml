name: Release Plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      beta:
        description: Explicitly allow a beta release from v4
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: telepilot-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/tests.yml
  release:
    needs: validate
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.beta && github.ref == 'refs/heads/v4')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: zip
      - name: Validate metadata and build allowlisted package
        run: php scripts/package.php
      - name: Check immutable version
        id: version
        env:
          ALLOW_BETA: ${{ inputs.beta || false }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ \* Version: //p' wp-telepilot.php | tr -d '\r')"
          TAG="v$VERSION"
          BETA=false
          if [[ "$VERSION" == *-beta.* ]]; then
            BETA=true
            [[ "$ALLOW_BETA" == true ]] || { echo 'Beta publication requires explicit opt-in'; exit 1; }
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Stable releases must come from main'; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $TAG already exists; it will not be replaced."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create immutable tag
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Publish new release only
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WP Telepilot ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.beta == 'true' }}
          make_latest: ${{ steps.version.outputs.beta == 'true' && 'false' || 'true' }}
          files: dist/wp-telepilot-*.zip
          overwrite_files: false
