name: Plugin Tests
on:
  pull_request:
  push:
    branches: [main, v4, 'maintenance/**']
  workflow_call:
permissions:
  contents: read
jobs:
  plugin-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: telepilot_tests_pcp
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest-only" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, mbstring, zip, openssl, curl
          tools: wp-cli:2.12.0
      - name: Build and extract the allowlisted plugin ZIP
        run: |
          php scripts/package.php
          mkdir -p .test-env/package
          unzip dist/wp-telepilot-*.zip -d .test-env/package
      - name: Prepare isolated WordPress and pinned Plugin Check
        run: |
          set -euo pipefail
          SITE="$PWD/.test-env/plugin-check-site"
          wp core download --path="$SITE"
          wp config create --path="$SITE" --dbname=telepilot_tests_pcp --dbuser=root --dbpass=test-only --dbhost=127.0.0.1:3306
          wp config set DISABLE_WP_CRON true --raw --path="$SITE"
          wp core install --path="$SITE" --url=http://telepilot.test --title='Plugin Check' --admin_user=checker --admin_password=disposable-test-only --admin_email=checker@example.test --skip-email
          VERSION="$(php -r '$p=json_decode(file_get_contents("scripts/plugin-check-policy.json"),true); echo $p["plugin_check_version"];')"
          curl -fsSL "https://downloads.wordpress.org/plugin/plugin-check.$VERSION.zip" -o .test-env/plugin-check-tool.zip
          php -r '$p=json_decode(file_get_contents("scripts/plugin-check-policy.json"),true); if(!hash_equals($p["tool_archive_sha256"],hash_file("sha256",".test-env/plugin-check-tool.zip"))){fwrite(STDERR,"Plugin Check archive checksum mismatch\n");exit(1);}'
          wp plugin install "$PWD/.test-env/plugin-check-tool.zip" --activate --path="$SITE"
          echo "TELEPILOT_CHECK_VERSION=$(wp plugin get plugin-check --field=version --path="$SITE")" >> "$GITHUB_ENV"
          echo "TELEPILOT_CHECK_WP_VERSION=$(wp core version --path="$SITE")" >> "$GITHUB_ENV"
      - name: Run every default check including runtime checks, then enforce reviewed warnings
        run: |
          set -euo pipefail
          SITE="$PWD/.test-env/plugin-check-site"
          wp --path="$SITE" plugin list-checks --format=json > .test-env/plugin-check-checks.json
          wp --path="$SITE" --require="$SITE/wp-content/plugins/plugin-check/cli.php" plugin check "$PWD/.test-env/package/wp-telepilot" --slug=wp-telepilot --mode=new --format=strict-json --fields=file,line,column,type,code,message,docs > .test-env/plugin-check.json
          php scripts/check-plugin-report.php .test-env/plugin-check.json .test-env/package/wp-telepilot dist/plugin-check-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-check-report
          path: |
            dist/plugin-check-report.json
            .test-env/plugin-check.json
            .test-env/plugin-check-checks.json
  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wordpress: '6.6.2'
            database: 'mysql:8.0'
          - php: '8.5'
            wordpress: 'latest'
            database: 'mysql:8.0'
          - php: '8.0'
            wordpress: '6.6.2'
            database: 'mariadb:10.11'
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: telepilot_tests
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptest-only" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TELEPILOT_TEST_DB_HOST: 127.0.0.1:3306
      TELEPILOT_TEST_DB_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, zip, openssl, curl
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Select current stable WordPress when requested
        id: wordpress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          if [ "$WP_VERSION" = latest ]; then
            WP_VERSION=$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ | php -r '$v=json_decode(stream_get_contents(STDIN),true); foreach($v["offers"] as $o){if($o["response"]==="upgrade"){echo $o["version"];break;}}')
            composer require --dev "wp-phpunit/wp-phpunit:$WP_VERSION" --no-interaction --with-all-dependencies
          fi
          echo "version=$WP_VERSION" >> "$GITHUB_OUTPUT"
      - run: php scripts/install-test-wordpress.php '${{ steps.wordpress.outputs.version }}'
      - name: Install the pinned official MCP Adapter for current WordPress tests
        if: matrix.wordpress == 'latest'
        run: |
          git clone --depth 1 --branch v0.6.1 https://github.com/WordPress/mcp-adapter.git .test-env/mcp-adapter
          composer install --working-dir=.test-env/mcp-adapter --no-dev --no-interaction --prefer-dist
          echo "TELEPILOT_TEST_MCP_PLUGIN=$PWD/.test-env/mcp-adapter/mcp-adapter.php" >> "$GITHUB_ENV"
      - name: PHP compatibility and syntax
        run: find includes tests scripts -name '*.php' -print0 | xargs -0 -n 1 php -l && php -l wp-telepilot.php && php -l uninstall.php
      - run: composer test
      - run: composer package
      - name: Test the packaged plugin, without development files
        run: |
          unzip dist/wp-telepilot-*.zip -d .test-env/package
          TELEPILOT_TEST_PLUGIN_FILE="$PWD/.test-env/package/wp-telepilot/wp-telepilot.php" composer test
      - uses: actions/upload-artifact@v4
        with:
          name: validated-plugin-php-${{ matrix.php }}-${{ strategy.job-index }}
          path: dist/*.zip
